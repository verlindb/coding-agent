services:
  children-activity-mcp-server:
    build: .
    environment:
      - CHILDREN_API_KEY=${CHILDREN_API_KEY}
      - CHILDREN_BASE_URL=${CHILDREN_BASE_URL:-https://api.children-activities.com/v1}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3000}
    env_file:
      - .env
    ports:
      - "${MCP_SERVER_PORT:-3000}:3000"
    restart: unless-stopped
    stdin_open: true
    tty: true